name: Rust 自动编译发布

on:
  schedule:
    - cron: '0 23 * * *'
  push:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'config/**'
      - '.github/workflows/rust-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 编译发布版本
        run: cargo build --release

      - name: 裁剪二进制体积
        run: strip target/release/adguard-china-dns

      - name: 生成规则文件
        run: |
          mkdir -p output
          OUTPUT_FILE="output/adguard_home_rules.txt" ./target/release/adguard-china-dns

      - name: 获取发布时间
        id: timestamp
        run: |
          TS=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')
          TAG="v-$(TZ='Asia/Shanghai' date '+%Y%m%d-%H%M')"
          echo "datetime=${TS}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: 清理历史 Release
        run: |
          echo "🧹 正在清理历史 Release ..."
          gh release list --json tagName -q '.[].tagName' 2>/dev/null | while read tag; do
            [ -z "$tag" ] && continue
            echo "  删除: $tag"
            gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          done
          echo "✅ 清理完成"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.timestamp.outputs.tag }}
          name: "${{ steps.timestamp.outputs.datetime }} 更新"
          files: |
            output/adguard_home_rules.txt
          body: |
            ## 自动编译产物

            - **更新时间**：${{ steps.timestamp.outputs.datetime }}（北京时间）
            - **规则文件**：`adguard_home_rules.txt`（可直接导入 AdGuard Home）

            ### 使用方式

            ```bash
            wget https://github.com/${{ github.repository }}/releases/latest/download/adguard_home_rules.txt
            ```
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
