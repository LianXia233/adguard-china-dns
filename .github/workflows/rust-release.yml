name: Rust 自动编译发布

on:
  schedule:
    - cron: '23 23 * * *'
  push:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'config/**'
      - '.github/workflows/rust-release.yml'
  workflow_dispatch:

# 定时与推送同时触发时取消旧运行，避免并发删建 Release 互相踩踏
concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo 依赖
        uses: Swatinem/rust-cache@v2

      - name: 代码风格检查
        run: cargo fmt --check

      - name: Clippy 静态检查
        run: cargo clippy --release --locked -- -D warnings

      - name: 单元测试
        run: cargo test --release --locked

      - name: 编译发布版本
        run: cargo build --release --locked

      - name: 裁剪二进制体积
        run: strip target/release/adguard-china-dns

      - name: 生成规则文件
        run: |
          mkdir -p output
          # 显式指定仓库内 config/ 目录（默认会取可执行文件同级目录，导致仓库配置被忽略）
          CONFIG_DIR="$GITHUB_WORKSPACE/config" \
          OUTPUT_FILE="output/adguard_home_rules.txt" \
          ./target/release/adguard-china-dns

      # 语法门禁：AdGuard Home 的 upstream_dns_file 只要有一行不合 dnsproxy 语法，
      # 启动就直接 fatal、DNS 全停。产物必须在发布前本地校验，避免把砖头发到 latest。
      - name: 产物语法校验（发布门禁）
        run: python3 tools/validate_upstream_dns_file.py output/adguard_home_rules.txt

      - name: 产物规模校验（防止上游格式漂移导致静默塌陷）
        run: |
          # 合组写法每行 50 个域名，域名总数应在 10 万量级；跌破阈值说明在线源改版或下载被截断
          N=$(python3 -c 'import re,sys
          t=0
          for l in open("output/adguard_home_rules.txt",encoding="utf-8"):
              m=re.match(r"^\[/([^]]*)/\]",l)
              if m: t+=m.group(1).count("/")+1
          print(t)')
          echo "产物域名条目数：${N}"
          if [ "${N}" -lt 50000 ]; then
            echo "::error::域名条目数 ${N} < 50000，疑似在线源格式漂移或下载不完整，终止发布"
            exit 1
          fi

      - name: 获取发布时间
        id: timestamp
        run: |
          TS=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')
          TAG="v-$(TZ='Asia/Shanghai' date '+%Y%m%d-%H%M')"
          echo "datetime=${TS}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: 发布 Release（先建后删，保证 latest 下载链接不中断）
        run: |
          gh release create "${{ steps.timestamp.outputs.tag }}" \
            output/adguard_home_rules.txt \
            --title "${{ steps.timestamp.outputs.datetime }} 更新" \
            --notes "$(cat <<'BODY'
          ## 自动编译产物

          - **更新时间**：${{ steps.timestamp.outputs.datetime }}（北京时间）
          - **规则文件**：`adguard_home_rules.txt`（可直接导入 AdGuard Home）

          ### 使用方式

          ```bash
          wget https://github.com/${{ github.repository }}/releases/latest/download/adguard_home_rules.txt
          ```
          BODY
          )"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 清理历史 Release（只保留最新）
        run: |
          # 每次编译都清掉陈旧产物，Release 列表里始终只有最新一份规则文件。
          # 安全性由前置门禁保证：语法校验 + 规模校验不通过就不会发布，也就不会出现"最新即砖"。
          NEW="${{ steps.timestamp.outputs.tag }}"
          if [ -z "$NEW" ]; then
            echo "新 Release tag 为空，跳过清理"
            exit 0
          fi
          echo "正在清理（仅保留 ${NEW}）..."
          gh release list --limit 100 --json tagName -q '.[].tagName' | while read -r tag; do
            [ -z "$tag" ] && continue
            [ "$tag" = "$NEW" ] && continue
            echo "  删除: $tag"
            gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          done
          echo "清理完成"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
