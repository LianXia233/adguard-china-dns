name: Rust Release

on:
  schedule:
    - cron: '0 23 * * *'       # UTC 23:00 = 北京时间 07:00
  push:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'config/**'
      - '.github/workflows/rust-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build (release)
        run: cargo build --release

      - name: Strip binary
        run: strip target/release/adguard-china-dns

      - name: Generate rules
        run: |
          mkdir -p output
          OUTPUT_FILE="output/adguard_home_rules.txt" ./target/release/adguard-china-dns

      - name: Upload binary to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rust-v${{ github.run_number }}
          name: "Rust Release #${{ github.run_number }}"
          files: |
            target/release/adguard-china-dns
            output/adguard_home_rules.txt
          body: |
            ## Rust 版自动编译

            - 编译目标: `x86_64-unknown-linux-gnu`
            - 二进制: `adguard-china-dns` (静态链接)
            - 规则文件: `adguard_home_rules.txt` (可直接导入 AdGuard Home)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
